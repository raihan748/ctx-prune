[package]
name = "ctx-prune"
version = "0.1.0"
edition = "2021"
authors = ["SMK Telkom Makassar Developer Team <dev@smktelkom-mks.sch.id>"]
description = "Token-budgeted repository slicer for AI/LLM prompts with language-aware comment stripping"
license = "MIT"
keywords = ["llm", "tokens", "bpe", "context-window", "prune"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
colored = "2.1"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
